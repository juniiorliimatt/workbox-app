sonar.projectKey=sonar-group-oojuniiin_workbox-app
sonar.organization=sonar-group-oojuniiin
sonar.qualitygate.wait=true

# Código de produção x testes: sem isso o Sonar trata os testes como código (duplicação e bugs contam).
sonar.sources=src
sonar.tests=src/test
sonar.test.inclusions=src/test/**/*.ts,src/test/**/*.tsx,src/test/**/*.mjs

# Cobertura: gerada pelo vitest (`npm run test:coverage`, job lint-test-build) e entregue ao job do Sonar como artefato.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/test/**,src/main.tsx,src/**/*.d.ts,src/interfaces/**
