stages:
  - verify
  - test

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

# Lint + testes unitários + build de produção (tsc -b && vite build) em toda branch/MR.
# Os testes E2E (npm run test:e2e) dependem de Docker + Chrome e ficam de fora do CI.
lint-test-build:
  stage: verify
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run test:coverage
    - npm run build
  # O sonarcloud-check (stage seguinte) lê coverage/lcov.info (sonar.javascript.lcov.reportPaths).
  artifacts:
    paths:
      - coverage/lcov.info
    expire_in: 1 week

sonarcloud-check:
  stage: test
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  # Recebe o coverage/lcov.info do job de testes; sem ele a cobertura do código novo seria 0%.
  needs:
    - job: lint-test-build
      artifacts: true
  script:
    - sonar-scanner
  only:
    - merge_requests
    - main
